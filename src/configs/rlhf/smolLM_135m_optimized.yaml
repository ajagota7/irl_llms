# Optimized Configuration for SmolLM-135M RLHF Training
# Designed for maximum speed and GPU utilization

# Model settings
model:
  name: "HuggingFaceTB/SmolLM-135M"
  learning_rate: 2e-6
  ppo_epochs: 1
  init_kl_coef: 0.1
  target: 4
  cliprange: 0.2
  cliprange_value: 0.2
  vf_coef: 0.1
  adap_kl_ctrl: true
  use_score_norm: true
  ratio_threshold: 10.0
  batch_size: 1024
  mini_batch_size: 128
  forward_batch_size: 128
  gradient_accumulation_steps: 1
  reward_model: "s-nlp/roberta_toxicity_classifier"
  use_raw_logits: true
  
  # Original generation parameters (with sampling)
  generation:
    min_length: 20
    output_min_length: 20
    output_max_length: 50
    do_sample: true
    top_k: 50
    top_p: 0.9

# Training parameters
training:
  num_train_epochs: 100
  save_freq: 50
  eval_freq: 50
  seed: 42

# Dataset settings
dataset:
  name: "allenai/real-toxicity-prompts"
  toxicity_threshold: 0.3
  input_min_text_length: 10
  input_max_text_length: 15
  test_size: 0.05

# Output settings
output:
  push_to_hub: true
  organization: "ajagota71"
  repository_name: "smolLM-135m-detox-optimized"

# WandB settings
wandb:
  project: "irl_llms"
  entity: null
  name: null

# Acceleration settings
acceleration:
  mixed_precision: "fp16"
  gradient_clipping: 1.0
  use_flash_attention: true 