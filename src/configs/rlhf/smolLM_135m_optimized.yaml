# Optimized Configuration for SmolLM-135M RLHF Training
# Designed for 15GB GPU with maximum efficiency

# Model settings
model:
  name: "HuggingFaceTB/SmolLM-135M"
  learning_rate: 1e-6
  
  # Optimized batch sizes for 15GB GPU
  batch_size: 1024
  mini_batch_size: 128
  forward_batch_size: 128
  gradient_accumulation_steps: 1
  
  # Faster PPO settings
  ppo_epochs: 2              # Reduced from 4 for speed
  init_kl_coef: 0.1          # Reduced for faster convergence
  target: 4
  cliprange: 0.2
  cliprange_value: 0.2
  vf_coef: 0.1
  adap_kl_ctrl: true
  use_score_norm: true
  ratio_threshold: 10.0
  
  # Reward model
  reward_model: "s-nlp/roberta_toxicity_classifier"
  use_raw_logits: true
  
  # Optimized generation parameters
  generation:
    min_length: 5
    output_min_length: 10    # Reduced from 15
    output_max_length: 15    # Reduced from 20
    do_sample: false         # Greedy decoding is faster
    top_k: 0.0
    top_p: 1.0

# Training parameters
training:
  num_train_epochs: 100
  save_freq: 25              # Less frequent saves
  eval_freq: 25              # Less frequent evals
  seed: 42

# Dataset settings
dataset:
  name: "allenai/real-toxicity-prompts"
  toxicity_threshold: 0.3
  input_min_text_length: 10  # Shorter sequences
  input_max_text_length: 15  # Shorter sequences
  test_size: 0.05            # Smaller eval set

# Output settings
output:
  push_to_hub: true
  organization: null
  repository_name: "smolLM-135m-detox-optimized"

# WandB settings
wandb:
  project: "irl_llms"
  entity: null
  name: null

# Acceleration settings
acceleration:
  mixed_precision: "fp16"    # Enable mixed precision
  gradient_clipping: 1.0     # Enable gradient clipping
  use_flash_attention: true  # Enable flash attention if available 