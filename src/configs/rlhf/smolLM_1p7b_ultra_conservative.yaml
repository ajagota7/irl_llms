# Configuration for SmolLM-1.7B RLHF (Ultra Conservative - Memory Fragmentation Fix)

# Model settings
model:
  name: "HuggingFaceTB/SmolLM-1.7B"
  learning_rate: 3e-6
  ppo_epochs: 1  # Minimal PPO epochs
  init_kl_coef: 0.5
  target: 2.5
  cliprange: 0.2
  cliprange_value: 0.2
  vf_coef: 0.1
  adap_kl_ctrl: true
  use_score_norm: true
  ratio_threshold: 10.0
  batch_size: 1  # Ultra conservative - single sample processing
  mini_batch_size: 1
  forward_batch_size: 1
  gradient_accumulation_steps: 16  # Increased to maintain effective batch size
  reward_model: "s-nlp/roberta_toxicity_classifier"
  use_raw_logits: true
  
  # Memory optimization settings
  use_half_precision: true
  use_gradient_checkpointing: true
  use_amp: true
  low_cpu_mem_usage: true
  
  # Generation parameters (ultra minimal)
  generation:
    min_length: 5
    output_min_length: 5  # Very short outputs
    output_max_length: 8  # Very short outputs
    do_sample: true
    top_k: 0.0
    top_p: 1.0
    use_cache: false  # Disable KV cache

# Training parameters
training:
  num_train_epochs: 100
  save_freq: 20
  eval_freq: 20
  seed: 42
  max_grad_norm: 1.0

# Dataset settings
dataset:
  name: "allenai/real-toxicity-prompts"
  toxicity_threshold: 0.3
  input_min_text_length: 15
  input_max_text_length: 20
  test_size: 0.1

# Output settings
output:
  push_to_hub: true
  organization: null
  repository_name: "SmolLM-1.7B-detox-ultra-conservative"

# WandB settings
wandb:
  project: "irl_llms"
  entity: null
  name: null

# Memory management settings
memory:
  device_memory_fraction: 0.8  # Use only 80% of available GPU memory
  pin_memory: false  # Disable pin memory to reduce fragmentation
  num_workers: 0  # Single-threaded data loading
  expandable_segments: true
  max_split_size_mb: 128  # Limit memory split size 