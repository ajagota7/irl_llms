# Configuration for SmolLM-135M RLHF with Optimizations

# Model settings
model:
  name: "HuggingFaceTB/SmolLM-135M"
  learning_rate: 1e-6
  ppo_epochs: 4
  init_kl_coef: 0.3
  target: 4
  cliprange: 0.2
  cliprange_value: 0.2
  vf_coef: 0.1
  adap_kl_ctrl: true
  use_score_norm: true
  ratio_threshold: 10.0
  
  # OPTIMIZED BATCH SIZES - Pre-calculated for efficiency
  # These will be overridden by automatic calculation based on GPU memory
  batch_size: 128  # Will be auto-adjusted based on GPU memory
  mini_batch_size: 32  # Will be auto-adjusted
  gradient_accumulation_steps: 4  # Will be auto-adjusted
  forward_batch_size: 32
  
  # Memory optimization settings
  use_gradient_checkpointing: true
  use_mixed_precision: true  # Enable bfloat16/fp16 training
  
  reward_model: "s-nlp/roberta_toxicity_classifier"
  use_raw_logits: true
  
  # Generation parameters
  generation:
    min_length: 5
    output_min_length: 15
    output_max_length: 20
    do_sample: true
    top_k: 0.0
    top_p: 1.0

# Training parameters
training:
  num_train_epochs: 100
  save_freq: 20
  eval_freq: 20
  seed: 42
  
  # Optimization settings
  use_async_io: true  # Enable async checkpoint saving and evaluation
  data_loader_workers: 4  # Number of data loading workers
  pin_memory: true  # Pin memory for faster GPU transfer

# Dataset settings
dataset:
  name: "allenai/real-toxicity-prompts"
  toxicity_threshold: 0.3
  input_min_text_length: 15
  input_max_text_length: 20
  test_size: 0.1
  
  # Data loading optimizations
  use_caching: true
  cache_dir: "./dataset_cache"
  batch_processing: true

# Output settings
output:
  push_to_hub: true
  organization: null
  repository_name: "smolLM-135m-detox"
  
  # Async I/O settings
  async_checkpoint_saving: true
  async_evaluation: true

# WandB settings
wandb:
  project: "irl_llms"
  entity: null
  name: null